name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate policy definitions and initiative
        run: python3 scripts/validate.py
      - name: Validate shell scripts and example JSON
        run: |
          bash -n scripts/*.sh
          jq empty examples/*.json
      - name: Test backup reconciliation automation
        run: python3 -m unittest discover -s tests -v
