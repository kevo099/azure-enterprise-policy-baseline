name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject tenant-specific and secret public content
        run: python3 scripts/check_public_content.py
      - name: Validate policy definitions and initiative
        run: python3 scripts/validate.py
      - name: Validate shell scripts and example JSON
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          jq empty examples/*.json
      - name: Compile the retained showcase Bicep
        run: az bicep build --file infra/policy-showcase.bicep --stdout > /dev/null
      - name: Test backup reconciliation automation
        run: python3 -m unittest discover -s tests -v
